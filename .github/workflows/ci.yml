name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: my_first_online_shop
          MYSQL_USER: shop_user
          MYSQL_PASSWORD: shop_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://shop_user:shop_password@127.0.0.1:3306/my_first_online_shop
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-auth-secret-change-in-production-2026
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      INTERNAL_API_BASE_URL: http://127.0.0.1:3001
      FRONTEND_URL: http://127.0.0.1:3000
      PAYMENTS_MODE: mock
      ALLOW_MOCK_PAYMENTS: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
      - name: Prepare database
        run: |
          npm --prefix server run db:push
          npm --prefix server run db:seed
      - name: Test API
        run: npm --prefix server test
      - name: Build storefront
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Test customer journey
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
